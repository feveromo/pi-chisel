name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install development dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      # smoke:configured is omitted: it needs a developer's installed Pi.
      - name: Lint, typecheck, and test
        run: npm run lint && npm run check && npm test && npm run test:capture && npm run pack:check

      - name: Pi TUI smoke test
        env:
          PI_BIN: ${{ github.workspace }}/node_modules/.bin/pi
        run: npm run test:smoke
